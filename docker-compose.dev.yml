version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quotemanagement
      POSTGRES_USER: quoteuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quoteuser -d quotemanagement"]
      interval: 10s
      timeout: 5s
      retries: 5

  # .NET API Backend (with hot reload)
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Database=quotemanagement;Username=quoteuser;Password=${DB_PASSWORD:-postgres123}
      JwtSettings__SecretKey: ${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGeneration12345!}
      JwtSettings__Issuer: QuoteManagementAPI
      JwtSettings__Audience: QuoteManagementClient
      JwtSettings__ExpiryMinutes: "60"
      ApiNinjas__ApiKey: ${API_NINJAS_KEY:-}
      AllowedOrigins__0: http://localhost
      ASPNETCORE_URLS: http://+:5000
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src
      - ./QuoteManagement.sln:/app/QuoteManagement.sln
    depends_on:
      db:
        condition: service_healthy

  # Angular Frontend (with hot reload)
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 80 --disable-host-check --proxy-config proxy.conf.json"
    environment:
      - NODE_ENV=development
    ports:
      - "80:80"
    volumes:
      - ./quote-management-client:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
